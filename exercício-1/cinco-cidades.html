<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cinco Cidades</title>
    <link rel="stylesheet" href="cinco-cidades.css">
</head>

<body>

    <!-- Navbar superior -->
    <nav class="navbar">
        <h1>Cinco Cidades</h1>

        <div class="nav-links">
            <a href="#inicio">Início</a>
            <a href="#sao-paulo">São Paulo</a>
            <a href="#rio-de-janeiro">Rio de Janeiro</a>
            <a href="#brasilia">Brasília</a>
            <a href="#salvador">Salvador</a>
            <a href="#recife">Recife</a>
        </div>
    </nav>

    <!-- Conteúdo principal -->
    <main class="container">

        <!-- Índice lateral -->
        <aside class="sidebar">

            <h2>Índice</h2>

            <ol>
                <li>
                    <a href="https://pt.wikivoyage.org/wiki/S%C3%A3o_Paulo"
                       target="visor">
                       <img src="sao-paulo.jpg" alt="São Paulo" width="200" height="125">
                        <h4>São Paulo</h4>
                    </a>
                </li>

                <li>
                    <a href="https://pt.wikivoyage.org/wiki/Rio_de_Janeiro"
                       target="visor">
                       <img src="rio-de-janeiro.jpg" alt="Rio de Janeiro" width="200" height="125">
                        <h4>Rio de Janeiro</h4>
                    </a>
                </li>

                <li>
                    <a href="https://pt.wikivoyage.org/wiki/Bras%C3%ADlia"
                       target="visor">
                       <img src="brasilia.jpg" alt="Brasilia" width="200" height="125">
                        <h4>Brasilia</h4>
                    </a>
                </li>

                <li>
                    <a href="https://pt.wikivoyage.org/wiki/Salvador"
                       target="visor">
                       <img src="salvador.jpg" alt="Salvador" width="200" height="125">
                        <h4>Salvador</h4>
                    </a>
                </li>

                <li>
                    <a href="https://pt.wikivoyage.org/wiki/Recife"
                       target="visor">
                       <img src="recife.jpg" alt="Recife" width="200" height="125">
                        <h4>Recife</h4>
                    </a>
                </li>
            </ol>

        </aside>

        <!-- Área direita -->
        <section class="content" id="inicio">

            <h2>Escolha uma cidade</h2>

            <p>
                Clique em uma cidade no índice ao lado para visualizar
                informações sobre ela.
            </p>

            <iframe
                name="visor"
                class="visor"
                title="Informações sobre a cidade">
            </iframe>

        </section>

    </main>

</body>

</html>
